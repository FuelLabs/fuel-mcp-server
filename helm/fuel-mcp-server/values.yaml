# Default values for fuel-mcp-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/fuellabs/fuel-mcp-server
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0608f1f"

indexer:
  image:
    repository: ghcr.io/fuellabs/fuel-mcp-server-indexer
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: "0608f1f"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 3500

ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: fuel-mcp-server.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: fuel-mcp-server-tls
  #    hosts:
  #      - fuel-mcp-server.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Resource limits for the init container (indexer)
initContainer:
  resources:
    requests:
      cpu: 2000m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 8Gi

# Persistent storage for the vector index
persistence:
  enabled: true
  size: 1Gi
  storageClass: "gp3-generic"
  # Optional: selector for specific PVs
  selector: {}
  # Optional: annotations for the PVC
  annotations: {}

# Storage configuration for the vector index
storage:
  # Storage class for the persistent volume
  storageClass: ""


# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

app:
  serviceMonitor:
    enabled: true
    prometheusRelease: kube-prometheus

nodeSelector: {}

tolerations: []

affinity: {}

# Additional volumes to be added to the pod
volumes: []

# Additional volume mounts to be added to the container
volumeMounts: []

docs:
  repository: "https://github.com/FuelLabs/fuel-mcp-server.git"
  branch: "main"
  path: "docs"
