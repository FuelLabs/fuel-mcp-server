apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "fuel-mcp-server.fullname" . }}-vectra-index
  labels:
    {{- include "fuel-mcp-server.labels" . | nindent 4 }}
  annotations:
    # Keep PVC even if Helm release is deleted
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- else if .Values.storage.storageClass }}
  storageClassName: {{ .Values.storage.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | default "1Gi" }}
  {{- if .Values.persistence.selector }}
  selector:
    {{- toYaml .Values.persistence.selector | nindent 4 }}
  {{- end }}