name: Build and publish Docker image

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  check-docs:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'release' && github.event.action == 'published') ||
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      docs-changed: ${{ steps.check-docs.outputs.docs-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for docs changes
        id: check-docs
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^docs/"; then
            echo "docs-changed=true" >> $GITHUB_OUTPUT
          else
            echo "docs-changed=false" >> $GITHUB_OUTPUT
          fi

  check-indexer:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'release' && github.event.action == 'published') ||
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      indexer-exists: ${{ steps.check-indexer.outputs.indexer-exists }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if indexer image exists
        id: check-indexer
        run: |
          if docker manifest inspect ghcr.io/fuellabs/fuel-mcp-server-indexer:latest; then
            echo "indexer-exists=true" >> $GITHUB_OUTPUT
          else
            echo "indexer-exists=false" >> $GITHUB_OUTPUT
          fi

  build-and-publish-app:
    uses: FuelLabs/github-actions/.github/workflows/docker-build-push.yml@master
    if: |
      (github.event_name == 'release' && github.event.action == 'published') ||
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    secrets:
      REGISTRY_USERNAME: ${{ github.repository_owner }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    with:
      auth-mode: registry-login
      registry: ghcr.io
      build-backend: native
      platforms: linux/amd64,linux/arm64
      runs-on-amd64: ubuntu-latest
      runs-on-arm64: ubuntu-24.04-arm
      digest-artifact-key: app
      dockerfile: deployment/Dockerfile
      docker-context: .
      image: ghcr.io/fuellabs/fuel-mcp-server
      tags: |
        type=ref,event=branch
        type=sha,prefix=
        type=semver,pattern={{raw}}

  build-and-publish-indexer:
    needs:
      - check-docs
      - check-indexer
    if: |
      (
        (github.event_name == 'release' && github.event.action == 'published') ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository)
      ) &&
      (
        needs.check-docs.outputs.docs-changed == 'true' ||
        needs.check-indexer.outputs.indexer-exists == 'false'
      )
    uses: FuelLabs/github-actions/.github/workflows/docker-build-push.yml@master
    secrets:
      REGISTRY_USERNAME: ${{ github.repository_owner }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    with:
      auth-mode: registry-login
      registry: ghcr.io
      build-backend: native
      platforms: linux/amd64,linux/arm64
      runs-on-amd64: ubuntu-latest
      runs-on-arm64: ubuntu-24.04-arm
      digest-artifact-key: indexer
      dockerfile: deployment/Dockerfile.indexer
      docker-context: .
      image: ghcr.io/fuellabs/fuel-mcp-server-indexer
      tags: |
        type=ref,event=branch
        type=sha,prefix=
        type=semver,pattern={{raw}}
